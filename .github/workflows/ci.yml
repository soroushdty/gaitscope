name: tests
# Pull requests into main only, from this repo's branches and from forks alike, so every
# PR gets the required checks (node, python (3.12), python (3.14)) exactly once.
# - Not on push: a fork's pushes run in the fork and don't count here, and a push trigger
#   next to this one would test each branch twice. Skipping jobs by event isn't an option:
#   a skipped job reports success under the same name as the required check.
# - pull_request, not pull_request_target: a fork's code runs with a read-only token and
#   no secrets. First-time contributors' runs wait for the owner's approval (repo setting).
# - Not on main: "Rebase and merge" rewrites the commits, but "branch must be up to date"
#   means the files that land on main are exactly the files the PR run tested.
on:
  pull_request:
    branches: [main]
jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]  # minimum supported and newest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run --locked pytest
