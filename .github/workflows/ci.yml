name: tests
# Branch pushes only. A pull_request trigger would test the same commit a second
# time. A push run on main would also repeat work: "Rebase and merge" rewrites the
# commits (new committer, new SHA), but "branch must be up to date" means the files
# that land on main are exactly the files the branch run tested.
on:
  push:
    branches-ignore: [main]
jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]  # minimum supported and newest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run --locked pytest
