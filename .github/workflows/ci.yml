name: tests
# Push only: a pull_request trigger would run the same commit a second time. With
# rebase-only merges and "branch must be up to date" on main, the pushed branch head
# is exactly what lands on main, so its push run is the check the PR needs.
on:
  push:
jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r python/requirements.txt
      - run: pytest tests/
